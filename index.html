<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#f1e6cf;--fg:#2b1d0e;--card:#fff8e7;--ac:#8a1c1c;--bd:#c9b48a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px Georgia,serif;text-align:center}
h1{font-size:20px;margin:8px 8px 4px;letter-spacing:1px}#w{position:relative;max-width:900px;margin:0 auto}
canvas{width:100%;display:block;border:3px solid var(--fg);border-radius:6px;background:#000;touch-action:none}

.card{background:var(--card);border:3px solid var(--fg);border-radius:10px;padding:14px;max-width:640px;width:100%;max-height:100%;overflow:auto;text-align:left}
.card h2{font-size:18px;margin:4px 0 8px}.card small{color:var(--ac);font-weight:700}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;border:2px solid var(--bd);border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.op:hover{border-color:var(--ac)}#ct{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}

</style></head><body>
<h1>BOSS RUSH CUÁNTICO</h1>
<div id="w"><canvas id="c"></canvas><div id="ov"><div class="card"><small id="tm"></small><h2 id="qt"></h2><div id="op"></div><p id="fb"></p><button id="ct">OK</button></div></div></div>

<p class="h">Mover: ← → o A D · Saltar: ↑, W o ESPACIO · Disparar: Z, X o J (mantené apretado) · Saltá sobre los disparos ROSAS para pararlos (parry) y hacerle más daño al jefe. Cada jefe te hace preguntas del TP N° 9.</p>
<script>
const Q=[["¿Qué es un nanomaterial y en qué rango de tamaño se clasifica?", "Material con estructuras de entre 1 y 100 nanómetros", "Material con estructuras de entre 1 y 100 micrómetros", "Material con estructuras de entre 1 y 100 milímetros", "Cualquier material visible a simple vista, de más de 1 mm"], ["¿Por qué los nanomateriales tienen propiedades distintas a las de los materiales macroscópicos?", "Por su enorme relación superficie/volumen y por los efectos cuánticos a esa escala", "Porque están hechos de elementos que no existen en la naturaleza", "Porque son siempre mucho más pesados que el material común", "Porque solo se pueden fabricar a temperaturas muy bajas"], ["¿Cuáles son los dos grandes métodos de síntesis de nanomateriales?", "Top-down (reducir un material grande) y bottom-up (construir desde átomos o moléculas)", "Top-down (construir desde átomos) y bottom-up (cortar un material grande)", "Solo filtración y destilación del material macroscópico", "Únicamente fusión y solidificación a alta presión"], ["¿Qué ventajas tienen los nanotubos de carbono frente a otros materiales conductores?", "Gran conductividad eléctrica y térmica, alta resistencia y muy poco peso", "Son aislantes eléctricos, muy pesados y poco resistentes", "Se funden a temperatura ambiente, por eso son fáciles de moldear", "Solo sirven como colorante, no conducen la electricidad"], ["¿Cómo revolucionó el grafeno la investigación en electrónica y energía?", "Es una lámina de carbono de un átomo de espesor, flexible, resistente y muy conductora: base de pantallas flexibles y baterías", "Es un metal pesado que reemplazó al silicio por ser tóxico", "Es un polímero aislante que solo se usa en envases", "Es un gas que se utiliza como combustible"], ["¿Qué aplicaciones tienen las nanopartículas metálicas en la medicina moderna?", "Entrega dirigida de fármacos, imágenes diagnósticas y acción antimicrobiana (oro, plata)", "Solo se usan como colorante de las pastillas", "Solo sirven para esterilizar el instrumental metálico", "Se utilizan únicamente como conservante de alimentos"], ["¿Qué rol cumplen los nanocompuestos en la industria automotriz y aeroespacial?", "Aligeran y refuerzan piezas, mejorando la resistencia y reduciendo el consumo", "Aumentan el peso de las piezas para dar más estabilidad", "Se usan solo para dar color a las carrocerías", "Reemplazan al combustible en los motores"], ["¿Qué significa nanobioelectrotecnología y qué disciplinas integra?", "Integra nanotecnología, biología y electrotecnología para crear sistemas híbridos que interactúan con seres vivos mediante señales eléctricas", "Integra astronomía, geología y mecánica de fluidos", "Es la fabricación de baterías de gran tamaño para automóviles", "Integra solamente informática y arquitectura"], ["¿Cómo se diferencia la nanobioelectrotecnología de la nanotecnología convencional?", "Además de trabajar a escala nano, se conecta con sistemas biológicos y usa señales eléctricas", "No se diferencia: es exactamente lo mismo", "Trabaja únicamente a escala macroscópica", "Excluye cualquier uso de la electricidad y de los seres vivos"], ["¿Qué papel cumple la biología en el diseño de dispositivos nanobioelectrónicos?", "Aporta elementos (enzimas, anticuerpos, ADN, células) que reconocen con precisión lo que se quiere detectar o estimular", "Solo aporta el color y la forma de la carcasa", "No participa: solo importa la parte electrónica", "Se encarga de proveer la energía nuclear al dispositivo"], ["¿Cómo funcionan los biosensores eléctricos en la detección de enfermedades?", "Un elemento biológico reconoce la biomolécula o el virus y eso produce un cambio eléctrico medible", "Cambian de color con la luz solar sin ninguna señal eléctrica", "Cortan el virus con nanotijeras mecánicas", "Solo funcionan si se inyecta un antibiótico al paciente"], ["¿Qué aplicaciones tiene la nanobioelectrotecnología en la ingeniería neuronal?", "Chips implantables que monitorean y estimulan la actividad cerebral", "Fabrican neuronas nuevas a partir de metal", "Se usan solo para refrigerar el cerebro", "Sirven para teñir los tejidos del cerebro"], ["¿Cómo permiten los biochips la medicina personalizada?", "Analizan datos de cada paciente (ADN, biomarcadores) para ajustar el diagnóstico y el tratamiento", "Dan exactamente el mismo tratamiento a todas las personas", "Solo registran la altura y el peso del paciente", "Reemplazan completamente al médico en cualquier decisión"], ["¿Qué avances existen en prótesis controladas por señales cerebrales?", "Interfaces cerebro-computadora que traducen señales neuronales en movimiento de prótesis o de un cursor", "Prótesis que se mueven solo con pilas comunes, sin conexión con el sistema nervioso", "Prótesis impresas que cambian de color según el clima", "Todavía no existe ningún avance en este campo"], ["¿Qué diferencia hay entre un sensor químico y un biosensor nanobioelectrónico?", "El biosensor usa un elemento biológico de reconocimiento (enzima, anticuerpo) y por eso es muy selectivo", "El sensor químico usa células vivas y el biosensor no", "No hay ninguna diferencia entre ambos", "El biosensor no es capaz de detectar ninguna sustancia"], ["¿Cómo se aprovecha la nanotecnología en la creación de tejidos artificiales?", "Nanofibras y nanomateriales forman andamios que guían el crecimiento celular y ayudan a regenerar tejido", "Se cortan tejidos naturales con nanocuchillos y se pegan", "Se usan solo para teñir la piel artificial", "Reemplazan a las células por plástico común"], ["¿Qué es la química cuántica y en qué se diferencia de la química clásica?", "Aplica la mecánica cuántica a átomos y moléculas y explica estructuras y reacciones por el comportamiento de los electrones", "Es la que cuenta cuántos átomos hay en una muestra y nada más", "Es exactamente lo mismo que la química clásica", "Estudia solo la escala macroscópica, sin tener en cuenta electrones"], ["¿Cuál es la importancia de la ecuación de Schrödinger en el estudio de los átomos?", "Permite calcular las funciones de onda y las energías de los electrones, base de los orbitales", "Calcula únicamente la masa del núcleo", "Mide la velocidad de la luz en el vacío", "Predice el color de los metales sin usar electrones"], ["Explica el principio de incertidumbre de Heisenberg: ¿cuál es la idea correcta?", "No se puede conocer con exactitud a la vez la posición y la velocidad de un electrón", "Con un buen microscopio se conocen exactamente posición y velocidad de un electrón", "La energía no se conserva en ninguna reacción", "Los electrones giran en órbitas fijas y perfectamente conocidas"], ["¿Qué significa que la energía esté cuantizada?", "Que solo puede tomar ciertos valores discretos (paquetes o cuantos), no cualquier valor", "Que puede tomar cualquier valor de forma continua", "Que la energía de un átomo siempre es cero", "Que se mide únicamente en fracciones de un cuarto"], ["¿Qué son los orbitales atómicos y cómo se clasifican?", "Regiones donde es más probable encontrar un electrón; se clasifican en s, p, d y f", "Órbitas circulares exactas de los electrones; solo existen s y p", "Los núcleos de los átomos pesados", "Capas de nanotubos de carbono"], ["¿Cómo explica la teoría cuántica el enlace químico entre átomos?", "Por la superposición de orbitales atómicos, que forma orbitales moleculares y comparte densidad electrónica", "Por la atracción gravitatoria entre los átomos", "Porque los núcleos de los átomos se fusionan", "Porque los electrones se detienen entre los átomos"], ["¿Qué relación existe entre los números cuánticos y la configuración electrónica?", "Los números cuánticos (n, l, m, s) describen cada electrón y determinan cómo se distribuyen en los orbitales", "Indican solo el color del elemento", "No tienen ninguna relación entre sí", "Indican la cantidad de neutrones del núcleo"], ["¿Qué papel cumple el spin del electrón en la estructura atómica?", "Un orbital admite como máximo 2 electrones y deben tener spines opuestos (principio de exclusión de Pauli)", "Define el color del orbital", "Permite que 5 electrones con igual spin ocupen un mismo orbital", "Es la velocidad de traslación del átomo completo"], ["¿Cómo se aplican los modelos cuánticos para predecir propiedades moleculares?", "Se calculan energías y distribución de electrones para predecir geometría, estabilidad, polaridad y reactividad", "Se tiran monedas para estimar las propiedades", "Se miden con una regla común", "Solo se copian valores de tablas sin hacer ningún cálculo"], ["¿Qué técnicas computacionales usa la química cuántica moderna?", "DFT (teoría del funcional de la densidad) y métodos ab initio, como Hartree-Fock", "Cromatografía y destilación", "Microscopía óptica y balanza analítica", "Solo titulaciones ácido-base"], ["¿Cómo se utiliza la química cuántica en el diseño de fármacos y materiales nuevos?", "Se simula cómo encaja y reacciona una molécula con su blanco antes de sintetizarla", "Se prueban directamente en personas, sin simular nada", "Se eligen al azar, por sorteo", "Solo se usa para diseñar el envase del producto"], ["¿Qué relación tiene la mecánica cuántica con la fluorescencia y los láseres?", "Los electrones saltan a niveles excitados y al volver a niveles menores emiten fotones de energía definida", "Los núcleos emiten luz cuando se rompen", "Los átomos solo calientan el aire que los rodea", "Los electrones desaparecen y reaparecen en otro átomo"], ["¿Qué es un estado excitado y cómo se produce?", "Un estado de mayor energía al que pasa un electrón al absorber energía (luz, calor, electricidad)", "El estado de menor energía posible de un átomo", "El estado en que el átomo pierde su núcleo", "El estado en que el átomo se enfría hasta el cero absoluto"], ["¿Por qué el modelo de Bohr fue superado por el modelo cuántico moderno?", "Explicaba bien solo al hidrógeno y no contemplaba la incertidumbre, los orbitales ni los átomos con varios electrones", "Porque Bohr se equivocó con la fórmula del agua", "Porque predecía demasiados colores en el espectro", "Porque nunca se midió ningún espectro atómico"], ["¿Qué aportes hizo la física cuántica al entendimiento de los semiconductores?", "La teoría de bandas de energía (banda de valencia, banda de conducción y brecha)", "Demostró que ningún material puede conducir electricidad", "Solo se aplica a metales líquidos", "Los explica únicamente con mecánica de fluidos"], ["¿Cómo se puede aplicar la química cuántica en la conversión de energía solar?", "Permite diseñar materiales que absorban luz y transfieran electrones de forma eficiente", "Se usa para orientar los paneles con una brújula", "Solo calcula el precio de los paneles", "No tiene ninguna aplicación en energía solar"], ["¿Qué diferencia hay entre un enlace covalente clásico y uno explicado cuánticamente?", "El clásico muestra electrones compartidos entre dos átomos; el cuántico los describe como orbitales moleculares con densidad deslocalizada", "El clásico roba electrones definitivamente; el cuántico forma iones", "No hay ninguna diferencia entre ambos", "El enlace cuántico no usa electrones"], ["¿Qué aplicaciones tiene la computación cuántica en la investigación química?", "Simular moléculas y reacciones complejas con una precisión que las computadoras clásicas no logran", "Solo almacenar fotos y videos", "Reemplazar hoy mismo a todos los laboratorios", "Solo navegar por internet más rápido"], ["¿Cómo se puede visualizar la densidad electrónica en una molécula?", "Con mapas e isosuperficies de densidad y orbitales calculados mediante software de modelado molecular", "Mirando la molécula con una lupa común", "Pesando la molécula en una balanza", "Midiendo su temperatura con un termómetro"], ["¿Cómo influye la química cuántica en el estudio de los nanomateriales?", "Explica propiedades como el color de las nanopartículas de oro o de los quantum dots por el confinamiento cuántico", "No influye en absoluto", "Solo explica cuánto pesan", "Solo sirve para empaquetarlos"]];
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');cv.width=800;cv.height=450;
const GY=390,R=Math.random,PL=[[0,7],[7,16],[16,36]],M=Math;
const BS=[{n:'NANO-GÓLEM DE GRAFENO',t:'NANOMATERIALES',hp:140,bg:['#e8dcc0','#b9a77f'],d:'Lanza nanotubos de carbono (bajos y altos) y abanicos de nanopartículas de oro.'},
{n:'NEURO-CHIP ELÉCTRICO',t:'NANOBIOELECTROTECNOLOGÍA',hp:170,bg:['#d9c8e8','#8d6bb0'],d:'Descarga rayos que marcan antes el lugar y suelta virus que rebotan por el piso.'},
{n:'EL ÁTOMO CUÁNTICO',t:'QUÍMICA CUÁNTICA',hp:200,bg:['#1a2a5a','#3b2a78'],d:'Se teletransporta (incertidumbre), lanza ondas senoidales y dispara electrones.'}];
let lv=0,P,bo,pb=[],eb=[],wn=[],tk=0,hp=3,inv=0,ok=0,bad=0,keys={},jp=0,st='menu',fl=0,cor=0,cq=0,onC=null;
function show(t,h,f,b){$('tm').textContent=t;$('qt').textContent=h;$('fb').textContent=f;$('op').innerHTML='';$('ct').hidden=!b;$('ct').textContent=b||'';$('ov').style.display='flex'}
const hide=()=>{$('ov').style.display='none'};
function intro(l){st='intro';lv=l;show(BS[l].t,'JEFE '+(l+1)+' DE 3: '+BS[l].n,BS[l].d,'¡A PELEAR!');onC=()=>start(l)}
function start(l){lv=l;const d=BS[l];bo={x:590,y:130,w:180,h:240,hp:d.hp,max:d.hp,t:0,ph:0,bl:0};P={x:90,y:GY-44,w:28,h:44,vy:0,on:true};pb=[];eb=[];wn=[];hp=3;inv=0;st='play';hide()}
function ask(){const[a,b]=PL[lv],i=a+M.floor(R()*(b-a)),q=Q[i],o=[0,1,2,3];st='q';
 for(let k=3;k>0;k--){const j=M.floor(R()*(k+1));[o[k],o[j]]=[o[j],o[k]]}
 cor=o.indexOf(0);show('¡EL JEFE SE DETIENE! RESPONDÉ PARA CURARTE Y DAÑARLO',q[0],'');$('ct').hidden=true;
 o.forEach((k,n)=>{const b=document.createElement('button');b.className='op';b.textContent=(n+1)+') '+q[k+1];b.onclick=()=>ans(n);$('op').appendChild(b)})}
function ans(n){if(st!='q')return;const r=n==cor;r?ok++:bad++;if(r){hp=M.min(3,hp+1);bo.hp-=bo.max*.06}
 [...$('op').children].forEach((e,k)=>{e.disabled=true;if(k==cor)e.style.borderColor='#2e9e5b';else if(k==n)e.style.borderColor='#d64545'});
 $('fb').textContent=r?'¡Correcto! Recuperás 1 corazón y el jefe recibe daño.':'Incorrecto. La respuesta correcta está en verde.';
 st='fb';$('ct').hidden=false;$('ct').textContent='SEGUIR LUCHANDO';onC=()=>{hide();st='play'}}
$('ct').onclick=()=>onC&&onC();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' '].includes(k))e.preventDefault();
 if(st=='q'&&k.length==1&&'1234'.includes(k))ans(+k-1);else if(k=='enter'&&st!='play'&&st!='q'&&onC)onC();
 if(!e.repeat&&['arrowup','w',' '].includes(k))jp=1;keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
[['bl','arrowleft'],['br','arrowright'],['bj','arrowup'],['bs','z']].forEach(([id,k])=>{const b=$(id);
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true;if(k=='arrowup')jp=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b['on'+v]=()=>keys[k]=false)});
const hitC=(o,r)=>{const cx=M.max(P.x,M.min(o.x,P.x+P.w)),cy=M.max(P.y,M.min(o.y,P.y+P.h));return(o.x-cx)**2+(o.y-cy)**2<r*r};
const hitR=o=>o.x<P.x+P.w&&o.x+o.w>P.x&&o.y<P.y+P.h&&o.y+o.h>P.y;
const orb=(x,y,vx,vy,c,o)=>eb.push(Object.assign({k:'o',x,y,vx,vy,r:10,c,p:0},o||{}));
function ai(){const t=++bo.t;
 if(lv==0){bo.y=130+M.sin(t/30)*10;
  if(t%90==30){const hi=R()<.5;eb.push({k:'t',x:800,y:hi?GY-120:GY-24,w:150,h:24,vx:-6})}
  if(t%90==60){for(let i=-2;i<=2;i++)orb(bo.x,bo.y+110,-4.5,i*1.5,i==0&&R()<.5?'#ff69b4':'#ffc107',{p:i==0&&R()<.5?1:0,r:9})}}
 else if(lv==1){bo.y=120+M.sin(t/25)*14;
  if(t%100==20)wn.push({x:P.x+14,t:45});
  if(t%100==60)orb(800,GY-16,-3.2,0,'#7cb342',{r:16,b:1,s:1});
  if(t%100==85)orb(bo.x,bo.y+60,-5,1,'#ff69b4',{p:1,r:12})}
 else{if(bo.bl>0)bo.bl--;
  if(t%120==10){bo.x=560+R()*100;bo.y=50+R()*140;bo.bl=25}
  if(t%120==45){for(let i=0;i<6;i++)orb(bo.x+i*34,bo.y+110,-5,0,'#4fc3f7',{w:1,y0:bo.y+110,ph:i*.8,r:9})}
  if(t%120==85){const a=M.atan2(P.y+20-bo.y-110,P.x-bo.x);for(let i=-1;i<=1;i++)orb(bo.x,bo.y+110,M.cos(a+i*.25)*5,M.sin(a+i*.25)*5,i==0&&R()<.4?'#ff69b4':'#fff176',{p:i==0&&R()<.4?1:0,r:10})}}}
function hurt(){if(inv>0)return;hp--;inv=90;if(hp<=0){st='over';show('DERROTA','¡Te noqueó '+BS[lv].n+'!','Aciertos: '+ok+' · Errores: '+bad,'REINTENTAR');onC=()=>start(lv)}}
function step(){tk++;if(st!='play')return;
 const L=keys.arrowleft||keys.a,Rt=keys.arrowright||keys.d;
 P.x=M.max(10,M.min(380,P.x+(Rt?4.5:0)-(L?4.5:0)));
 if(jp&&P.on){P.vy=-13.5;P.on=false;jp=0}
 P.vy+=.65;P.y+=P.vy;if(P.y>=GY-P.h){P.y=GY-P.h;P.vy=0;P.on=true}
 if((keys.z||keys.x||keys.j||keys.k)&&tk%7==0)pb.push({x:P.x+30,y:P.y+14,vx:12});
 pb.forEach(b=>{b.x+=b.vx;if(b.x>bo.x+20&&b.x<bo.x+bo.w&&b.y>bo.y&&b.y<bo.y+bo.h&&!(lv==2&&bo.bl>0)){bo.hp--;b.x=9e3;fl=3}});pb=pb.filter(b=>b.x<800);
 ai();wn.forEach(w=>{if(--w.t==0)eb.push({k:'b',x:w.x-18,y:0,w:36,h:GY,life:18})});wn=wn.filter(w=>w.t>0);
 eb.forEach(e=>{if(e.k=='o'){e.x+=e.vx;if(e.w){e.y=e.y0+M.sin(e.x/40+e.ph)*55}else e.y+=e.vy;if(e.b){e.vy+=.4;if(e.y>GY-e.r){e.y=GY-e.r;e.vy=-8}}
   if(e.p&&jp&&!P.on&&hitC(e,e.r+14)){e.x=-9e3;bo.hp-=5;P.vy=-10;jp=0;fl=5}
   else if(hitC(e,e.r-2)){hurt()}}
  else if(e.k=='t'){e.x+=e.vx;if(hitR(e))hurt()}
  else if(e.k=='b'){if(--e.life<0)e.x=-9e3;else if(hitR(e))hurt()}});
 eb=eb.filter(e=>e.x>-200&&e.x<900&&e.y<500);jp=0;if(inv>0)inv--;if(fl>0)fl--;
 if(bo.hp<=0){st='win';eb=[];if(lv<2){show('¡JEFE DERROTADO!',BS[lv].n+' cayó','Aciertos: '+ok+' · Errores: '+bad,'SIGUIENTE JEFE');onC=()=>intro(lv+1)}
  else{show('¡GANASTE!','Derrotaste a los 3 jefes del TP N° 9','Aciertos: '+ok+' de '+(ok+bad)+' preguntas · Errores: '+bad,'JUGAR DE NUEVO');onC=()=>{ok=bad=0;intro(0)}}return}
 if(bo.ph<3&&bo.hp<=bo.max*(1-.25*(bo.ph+1))){bo.ph++;eb=[];wn=[];ask()}}
